executor: slurm
jobs: 100000
cores: 100000

# rules to execute locally, because they're too fast to bother with cluster submission
# localrules: all_one_pops, all_two_pops, all

# use sensible defaults for your cluster
default-resources:
    slurm_account: "co_moilab"
    slurm_partition: "savio3_htc"
    slurm_qos: "savio_lowprio"
    ntasks: 1
    cpus_per_task: 1
    runtime: "30m"
    mem_mb: 0

# here only rules, which require different (more) resources:
set-resources:
    datasets_rehydrate:
        time: "2880m"
        cpus_per_task: 10
        retries: 3
    real_fastp:
        cpus_per_task: 4
    real_freqk_ref_dedup:
        cpus_per_task: 8
    bwa_mem:
        cpus_per_task: 4
    iss:
        runtime: "60m"
        cpus_per_task: 1
    fastp:
        cpus_per_task: 1
    freqk_count:
        cpus_per_task: 2
    real_freqk_count:
        cpus_per_task: 16
    vg_autoindex:
        cpus_per_task: 2
    vg_giraffe_paired:
        cpus_per_task: 2
    vg_giraffe_unpaired:
        cpus_per_task: 2
    vg_surject:
        cpus_per_task: 2
    samtools_markdup:
        cpus_per_task: 2
    real_vg_autoindex:
        cpus_per_task: 16
    real_vg_giraffe_paired:
        runtime: "2880m"
        cpus_per_task: 16
    real_vg_giraffe_unpaired:
        cpus_per_task: 16
    real_vg_surject:
        cpus_per_task: 16
        runtime: "2880m"
    freebayes_vg:
        runtime: "60m"
        cpus_per_task: 2
    freebayes_a_priori:
        cpus_per_task: 2
    freebayes_de_novo:
        cpus_per_task: 2
    real_freebayes_vg:
        runtime: "2880m"
        cpus_per_task: 16
    sra:
        cpus_per_task: 6
        runtime: "1440m"

# parallelization with threads needs to be defined separately:
# threads and cpus_per_task are supposed to be synonymous for this plugin, but for some reason I need to specify them separately
set-threads:
    sra: 6
    datasets_rehydrate: 10
    real_fastp: 4
    real_freqk_ref_dedup: 1
    bwa_mem: 4
    fastp: 2
    iss: 2
    freqk_count: 2
    real_freqk_count: 16
    vg_autoindex: 2
    vg_giraffe_paired: 2
    vg_giraffe_unpaired: 2
    vg_surject: 2
    samtools_markdup: 2
    real_vg_giraffe_paired: 16
    real_vg_giraffe_unpaired: 16
    real_vg_surject: 16
    freebayes_a_priori: 1 
    freebayes_de_novo: 1
    freebayes_vg: 1
    real_freebayes_vg: 16
