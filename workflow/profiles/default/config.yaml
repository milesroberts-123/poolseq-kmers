executor: slurm
jobs: 10000
cores: 10000

# rules to execute locally, because they're too fast to bother with cluster submission
# localrules: all_one_pops, all_two_pops, all

# use sensible defaults for your cluster
default-resources:
    slurm_account: "co_moilab"
    slurm_partition: "savio3_htc"
    slurm_extra: "--qos=savio_lowprio"
    ntasks: 1
    cpus_per_task: 1
    runtime: "180m"
    mem_mb: 0

# here only rules, which require different (more) resources:
set-resources:
    sra:
        cpus_per_task: 6
    real_fastp:
        cpus_per_task: 4
    real_freqk_count:
        cpus_per_task: 4
    bwa_mem:
        cpus_per_task: 4
    iss:
        cpus_per_task: 2
    fastp:
        cpus_per_task: 2
    freqk_count:
        cpus_per_task: 4
    vg_giraffe_paired:
        cpus_per_task: 4
    vg_giraffe_unpaired:
        cpus_per_task: 4
    vg_surject:
        cpus_per_task: 4
    freebayes_a_priori:
        cpus_per_task: 2
    freebayes_de_novo:
        cpus_per_task: 2

# parallelization with threads needs to be defined separately:
# threads and cpus_per_task are supposed to be synonymous for this plugin, but for some reason I need to specify them separately
set-threads:
    sra: 6
    real_fastp: 4
    real_freqk_count: 4
    bwa_mem: 4
    fastp: 2
    iss: 2
    freqk_count: 4
    vg_giraffe_paired: 4
    vg_giraffe_unpaired: 4
    vg_surject: 4
    freebayes_a_priori: 1 
    freebayes_de_novo: 1
